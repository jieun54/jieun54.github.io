# Your name and info, shown in the header on every page
title: Ji Eun (Jinny) Kim          # English name (also the browser-tab title)
name_ko: 김지은                     # Korean name shown next to it; leave empty to hide
role: Ph.D. Candidate
affiliation: University of Michigan School of Information
# affiliation_url: https://www.si.umich.edu/
email: jieunkim (at) umich.edu
avatar: assets/img/profile.jpg   # 900px copy of JinnyKim.jpg; resize new photos the same way

# Links shown in [brackets] under your name. Delete a line to hide it;
# add a new "- name: / url:" pair to add one. Order here = order on the page.
links:
  - name: CV
    url: assets/files/Jinny_CV.pdf
  - name: Google Scholar
    url: https://scholar.google.com/citations?user=UqlTYVsAAAAJ&hl=en
  - name: ORCID
    url: https://orcid.org/0009-0008-1414-7341
  - name: GitHub
    url: https://github.com/jieun54
  - name: LinkedIn
    url: https://www.linkedin.com/in/ji-eun-kim-9bb0b1316/

# Top menu. "url" is a page on this site (starts with /) or a full link.
# To bring a tab back, remove the "# " in front of its two lines.
nav:
  - name: Home
    url: /
  # - name: Research
  #   url: /research/
  # - name: CV
  #   url: /assets/files/Jinny_CV.pdf

# How many publications the Home page shows under "Recent Publications"
recent_publications: 3
# Where "View all →" next to Recent Publications goes.
# When the Research page is back, change this to /research/#publications
all_publications_url: https://scholar.google.com/citations?user=UqlTYVsAAAAJ&hl=en
# Show the grey theme tag (e.g. "Prosocial behavior") on each publication: true or false
show_theme_tags: false

# Search engines and link previews
description: Ji Eun (Jinny) Kim is a Ph.D. candidate at the University of Michigan School of Information who studies how human behavior and social interaction in online spaces emerge through the interplay of users, social contexts, and technologies.
keywords: Ji Eun Kim, Jieun Kim, Jinny Kim, 김지은, computational social science, University of Michigan
url: https://jieun54.github.io
baseurl: ""
lang: en

# Build settings (no need to change)
markdown: kramdown
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
