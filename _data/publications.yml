# ------------------------------------------------------------
# Publications. Newest first: add new papers at the TOP.
# Home shows the first few (see recent_publications in _config.yml);
# the Research page shows all of them, grouped by year.
#
# Fields (only title, authors, year, venue are required):
#   title       paper title (wrap in "double quotes")
#   authors     author list; put <strong></strong> around your name
#   year        used for the year headings on the Research page
#   venue       short badge text, e.g. ICWSM 2026
#   venue_full  full venue name shown in italics
#   theme       one key from _data/themes.yml (prosocial, antisocial, inequality)
#   pdf / code / data / slides / poster   links, each shown as a button
#   abstract    optional; adds an "Abstract" button that expands it
#   image       optional thumbnail, e.g. assets/img/papers/twitch.png
#   note        optional short label, e.g. "Best Paper Award" or "To appear"
# ------------------------------------------------------------

